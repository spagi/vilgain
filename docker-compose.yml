version: '3.8'

services:
  php:
    build: ./docker/php
    container_name: symfony_app_php
    volumes:
      - ./symfony:/var/www/symfony
    environment:

      APP_ENV: dev
      APP_DEBUG: 1
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/data.db"
      JWT_PASSPHRASE: "YourSuperSecretPassphrase"
      user: "${UID_GID:-1000:1000}"

  nginx:
    image: nginx:1.25-alpine
    container_name: symfony_app_nginx
    ports:
      - "8088:80"
    volumes:
      - ./symfony/public:/var/www/symfony/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php