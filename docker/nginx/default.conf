server {
    listen 80;
    server_name localhost;
    root /var/www/symfony/public;

    # Logování do stdout/stderr kontejneru, pokud nejsou specifikovány soubory.
    # Nebo explicitně:
    # access_log /dev/stdout;
    # error_log /dev/stderr;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000; # 'php' je název služby PHP v docker-compose
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS off; # Pokud nepoužíváte HTTPS terminate před Nginx
        internal;
    }

    # Ochrana před přístupem k .ht souborům
    location ~ /\.ht {
        deny all;
    }
}